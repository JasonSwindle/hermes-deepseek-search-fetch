name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3-OS matrix on purpose: the plugin was developed on Linux, and this is the
        # only place its portability claim (loopback mock server, block on a random
        # port, no platform-specific imports) is actually tested rather than reasoned.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Tier 1: stdlib only. httpx is deliberately unpinned here — a newer httpx
      # breaking the plugin is a real compatibility signal worth failing on.
      - name: Zero-dependency tier (stdlib unittest, no Hypothesis)
        run: |
          python -m pip install --disable-pip-version-check httpx
          python -m unittest discover -s tests

      # Tier 2: the pinned dev extras add Hypothesis to the same suite, so the
      # property tests stop skipping.
      - name: Full tier (property tests)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m unittest discover -s tests

  # Per-commit plugin validation is NOT duplicated here: the Hermes plugin catalog
  # runs `hermes plugins validate` at the pinned commit during admission, which
  # needs a full Hermes install. Run it locally before opening a catalog PR:
  #   hermes plugins validate .
