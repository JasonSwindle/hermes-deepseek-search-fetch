name: Feature request
description: Suggest different behaviour, a new option, or a change to a default.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: the README's **Tune it** table covers the existing knobs, and
        [AGENTS.md](https://github.com/JasonSwindle/hermes-deepseek-search-fetch/blob/main/AGENTS.md)
        lists the invariants a change must not break (bare-list `extract()`, no network in
        `is_available()`, the validated base URL, the 1–50 clamp, no new runtime dependency).

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: Describe the friction, not the solution — what are you trying to do that's awkward or impossible today?
      placeholder: Multi-URL extracts run sequentially and a slow five-URL batch takes ~25s.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to happen instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or upstream changes that might cover it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Search behaviour
        - Extract behaviour
        - Configuration
        - Routing or provider selection
        - Documentation
        - Tests or CI
        - Catalog packaging
        - Other
    validations:
      required: true

  - type: dropdown
    id: dependency
    attributes:
      label: Would this require a new runtime dependency?
      description: The plugin ships with zero dependencies; a proposal that needs one has a much higher bar.
      options:
        - "No"
        - "Yes — and that is part of the point"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I understand the invariants in AGENTS.md must keep holding (a change that breaks one needs to say so explicitly)
          required: true
